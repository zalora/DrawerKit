version: 2.1

jobs:
  build:
    macos:
      xcode: "15.2.0"
    steps:
      - checkout
      - run:
          name: Build DrawerKit (SPM library)
          command: |
            set -o pipefail
            xcodebuild \
              -project DrawerKitDemo/DrawerKitDemo.xcodeproj \
              -scheme DrawerKit \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              clean build | xcpretty -c
      - run:
          name: Build DrawerKitDemo
          command: |
            set -o pipefail
            xcodebuild \
              -project DrawerKitDemo/DrawerKitDemo.xcodeproj \
              -scheme DrawerKitDemo \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              CODE_SIGNING_ALLOWED=NO \
              clean build | xcpretty -c

workflows:
  version: 2
  test:
    jobs:
      - build
